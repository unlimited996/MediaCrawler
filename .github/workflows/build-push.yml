name: build-and-push

# 触发条件：
#   * push 到 main（改代码/改 Dockerfile/改前端都算）
#   * 手动触发（Actions 页面 Run workflow），可指定额外 tag
#   * 打 tag（v1.2.3）时额外打一个版本 tag
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".workbuddy/**"
  workflow_dispatch:
    inputs:
      extra_tag:
        description: "额外镜像 tag（留空则只用 latest + sha）"
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # 腾讯云容器镜像服务（个人版/企业版都适用）
  REGISTRY: ccr.ccs.tencentyun.com

jobs:
  # 一个 job 里顺序构建两个镜像：
  #   * 前端（webui）在 Stage 1 只 npm build 一次，第二张镜像直接命中缓存复用；
  #   * 两张镜像共用同一个 GHA cache scope（apt/pip/playwright 层只装一次）。
  # 保证「同一份前端 + 同一份代码」产出两个镜像，同时比矩阵双 job 快。
  build:
    name: build crawler + library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 计算镜像名与 tag
        id: meta
        env:
          # 命名空间用仓库变量覆盖；未配置时用默认值
          NAMESPACE: ${{ vars.TENCENT_NAMESPACE || 'unlimited996' }}
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          CRAWLER="${REGISTRY}/${NAMESPACE}/mediacrawler-crawler"
          LIBRARY="${REGISTRY}/${NAMESPACE}/mediacrawler-library"

          CTAGS="${CRAWLER}:latest,${CRAWLER}:sha-${SHORT_SHA}"
          LTAGS="${LIBRARY}:latest,${LIBRARY}:sha-${SHORT_SHA}"
          if echo "${GITHUB_REF_NAME}" | grep -qE '^v[0-9]'; then
            CTAGS="${CTAGS},${CRAWLER}:${GITHUB_REF_NAME}"
            LTAGS="${LTAGS},${LIBRARY}:${GITHUB_REF_NAME}"
          fi
          if [ -n "${{ github.event.inputs.extra_tag }}" ]; then
            CTAGS="${CTAGS},${CRAWLER}:${{ github.event.inputs.extra_tag }}"
            LTAGS="${LTAGS},${LIBRARY}:${{ github.event.inputs.extra_tag }}"
          fi

          {
            echo "crawler_tags=${CTAGS}"
            echo "library_tags=${LTAGS}"
            echo "short_sha=${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### 本次构建的镜像"
            echo ""
            echo "- crawler: \`${CTAGS}\`"
            echo "- library: \`${LTAGS}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 检查推送凭据
        id: creds
        env:
          USER: ${{ secrets.TENCENT_REGISTRY_USERNAME }}
          PASS: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}
        run: |
          if [ -n "$USER" ] && [ -n "$PASS" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
            echo "有推送凭据，构建后会推送到 ${REGISTRY}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ 未配置 TENCENT_REGISTRY_USERNAME / TENCENT_REGISTRY_PASSWORD，本次仅构建不推送" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 登录腾讯云镜像仓库
        if: steps.creds.outputs.has == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TENCENT_REGISTRY_USERNAME }}
          password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}

      # ---- 镜像 1：crawler（抓取服务；容器内同时跑 worker）----
      - name: 构建并推送 crawler
        id: crawler
        uses: docker/build-push-action@v6
        with:
          context: .
          target: crawler
          push: ${{ steps.creds.outputs.has == 'true' }}
          tags: ${{ steps.meta.outputs.crawler_tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=mediacrawler-crawler
          cache-from: type=gha,scope=mediacrawler
          cache-to: type=gha,mode=max,scope=mediacrawler
          build-args: |
            NPM_REGISTRY=https://registry.npmmirror.com

      # ---- 镜像 2：library（内容库 + 网关 + 前端静态页）----
      - name: 构建并推送 library
        id: library
        uses: docker/build-push-action@v6
        with:
          context: .
          target: library
          push: ${{ steps.creds.outputs.has == 'true' }}
          tags: ${{ steps.meta.outputs.library_tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=mediacrawler-library
          # 同一个 scope：前端 npm build 与 python 依赖层直接命中第一张镜像的缓存
          cache-from: type=gha,scope=mediacrawler
          cache-to: type=gha,mode=max,scope=mediacrawler
          build-args: |
            NPM_REGISTRY=https://registry.npmmirror.com

      - name: 记录结果
        run: |
          {
            echo ""
            echo "### 结果"
            echo ""
            echo "- crawler digest: \`${{ steps.crawler.outputs.digest }}\`"
            echo "- library digest: \`${{ steps.library.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.creds.outputs.has }}" != "true" ]; then
            {
              echo ""
              echo "ℹ️ 镜像已构建但**未推送**（缺密钥）。到仓库 Settings → Secrets and variables → Actions 添加："
              echo "- \`TENCENT_REGISTRY_USERNAME\`"
              echo "- \`TENCENT_REGISTRY_PASSWORD\`"
              echo ""
              echo "然后在 Actions 里 Re-run 本工作流即可推送。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          docker images | head -6 || true
