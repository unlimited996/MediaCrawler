name: build-and-push

# 触发条件：**仅手动触发**（Actions 页面 Run workflow）。
# push 触发已移除：GitHub runner 在海外，跨境推 CCR 反复超时；
# 构建/推送统一走国内服务器上的 deploy/server-update.sh（mc-update）。
on:
  workflow_dispatch:
    inputs:
      extra_tag:
        description: "额外镜像 tag（留空则只用 latest + sha）"
        required: false
        default: ""
      push_images:
        description: "推送镜像到 CCR（填 false 则只构建验证，用于快速排障）"
        required: false
        default: "true"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # 腾讯云容器镜像服务（个人版/企业版都适用）
  REGISTRY: ccr.ccs.tencentyun.com

jobs:
  # 一个 job 里顺序构建两个镜像：
  #   * 前端（webui）在 Stage 1 只 npm build 一次，第二张镜像直接命中缓存复用；
  #   * 两张镜像共用同一个 GHA cache scope（apt/pip/playwright 层只装一次）。
  # 保证「同一份前端 + 同一份代码」产出两个镜像，同时比矩阵双 job 快。
  build:
    name: build crawler + library
    runs-on: ubuntu-latest
    # 跨境推 CCR 可能很慢，但绝不能让 job 无限挂到 6 小时默认值；
    # 到点失败并给出明确结论，配合下面的兜底指引走国内推送脚本。
    timeout-minutes: 100
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 计算镜像名与 tag
        id: meta
        env:
          # 命名空间用仓库变量覆盖；未配置时用默认值
          NAMESPACE: ${{ vars.TENCENT_NAMESPACE || 'unlimited996' }}
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          CRAWLER="${REGISTRY}/${NAMESPACE}/mediacrawler-crawler"
          LIBRARY="${REGISTRY}/${NAMESPACE}/mediacrawler-library"

          CTAGS="${CRAWLER}:latest,${CRAWLER}:sha-${SHORT_SHA}"
          LTAGS="${LIBRARY}:latest,${LIBRARY}:sha-${SHORT_SHA}"
          if echo "${GITHUB_REF_NAME}" | grep -qE '^v[0-9]'; then
            CTAGS="${CTAGS},${CRAWLER}:${GITHUB_REF_NAME}"
            LTAGS="${LTAGS},${LIBRARY}:${GITHUB_REF_NAME}"
          fi
          if [ -n "${{ github.event.inputs.extra_tag }}" ]; then
            CTAGS="${CTAGS},${CRAWLER}:${{ github.event.inputs.extra_tag }}"
            LTAGS="${LTAGS},${LIBRARY}:${{ github.event.inputs.extra_tag }}"
          fi

          {
            echo "crawler_tags=${CTAGS}"
            echo "library_tags=${LTAGS}"
            echo "short_sha=${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### 本次构建的镜像"
            echo ""
            echo "- crawler: \`${CTAGS}\`"
            echo "- library: \`${LTAGS}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 检查推送凭据
        id: creds
        env:
          USER: ${{ secrets.TENCENT_REGISTRY_USERNAME }}
          PASS: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}
        run: |
          if [ -n "$USER" ] && [ -n "$PASS" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
            echo "有推送凭据，构建后会推送到 ${REGISTRY}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ 未配置 TENCENT_REGISTRY_USERNAME / TENCENT_REGISTRY_PASSWORD，本次仅构建不推送" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 登录腾讯云镜像仓库
        if: steps.creds.outputs.has == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TENCENT_REGISTRY_USERNAME }}
          password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}

      # ---- 镜像 1：crawler（抓取服务；容器内同时跑 worker）----
      - name: 构建并推送 crawler
        id: crawler
        uses: docker/build-push-action@v6
        # step 级超时（不能写进 with:，否则被当成 action 的未知输入直接忽略）
        timeout-minutes: 45
        with:
          context: .
          target: crawler
          push: ${{ steps.creds.outputs.has == 'true' && github.event.inputs.push_images != 'false' }}
          # build-push-action@v6 默认会生成 provenance attestation（mode=max），
          # 即 --attest type=provenance,mode=max。腾讯云 CCR 对 OCI 1.1
          # attestation manifest 支持不完善，实测会卡在 "exporting to image"
          # 不动（认证已过、GHA cache 已导出完成，只剩最后这个 manifest）。
          # 关掉它只推普通镜像，同时给单步加超时避免无限挂起。
          provenance: false
          tags: ${{ steps.meta.outputs.crawler_tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=mediacrawler-crawler
          cache-from: type=gha,scope=mediacrawler
          cache-to: type=gha,mode=max,scope=mediacrawler
          # 容器内 HEADLESS=true、无 X server，只需 headless shell；
          # library 目标不经过 browser-runtime，这个 arg 对它是空操作。
          build-args: |
            NPM_REGISTRY=https://registry.npmmirror.com
            PLAYWRIGHT_BROWSER=chromium-headless-shell

      # ---- 镜像 2：library（内容库 + 网关 + 前端静态页）----
      - name: 构建并推送 library
        id: library
        uses: docker/build-push-action@v6
        # step 级超时（不能写进 with:，否则被当成 action 的未知输入直接忽略）
        timeout-minutes: 45
        with:
          context: .
          target: library
          push: ${{ steps.creds.outputs.has == 'true' && github.event.inputs.push_images != 'false' }}
          # build-push-action@v6 默认会生成 provenance attestation（mode=max），
          # 即 --attest type=provenance,mode=max。腾讯云 CCR 对 OCI 1.1
          # attestation manifest 支持不完善，实测会卡在 "exporting to image"
          # 不动（认证已过、GHA cache 已导出完成，只剩最后这个 manifest）。
          # 关掉它只推普通镜像，同时给单步加超时避免无限挂起。
          provenance: false
          tags: ${{ steps.meta.outputs.library_tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=mediacrawler-library
          # 同一个 scope：前端 npm build 与 python 依赖层直接命中第一张镜像的缓存
          cache-from: type=gha,scope=mediacrawler
          cache-to: type=gha,mode=max,scope=mediacrawler
          # 容器内 HEADLESS=true、无 X server，只需 headless shell；
          # library 目标不经过 browser-runtime，这个 arg 对它是空操作。
          build-args: |
            NPM_REGISTRY=https://registry.npmmirror.com
            PLAYWRIGHT_BROWSER=chromium-headless-shell

      - name: 记录结果
        # 构建/推送失败时前面的 step 会跳过，这里必须总是执行才能把兜底指引写出来
        if: always()
        run: |
          {
            echo ""
            echo "### 结果"
            echo ""
            echo "- crawler digest: \`${{ steps.crawler.outputs.digest }}\`"
            echo "- library digest: \`${{ steps.library.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.creds.outputs.has }}" != "true" ]; then
            {
              echo ""
              echo "ℹ️ 镜像已构建但**未推送**（缺密钥）。到仓库 Settings → Secrets and variables → Actions 添加："
              echo "- \`TENCENT_REGISTRY_USERNAME\`"
              echo "- \`TENCENT_REGISTRY_PASSWORD\`"
              echo ""
              echo "然后在 Actions 里 Re-run 本工作流即可推送。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ job.status }}" != "success" ]; then
            {
              echo ""
              echo "### ⚠️ 构建 / 推送未完成"
              echo ""
              echo "- 卡在 \`exporting to image\` 或超时：通常是 GitHub 海外 runner 跨境推"
              echo "  大镜像到 \`ccr.ccs.tencentyun.com\` 太慢，或 registry 不接受 attestation。"
              echo "- 本工作流已关闭 provenance、单步 30 分钟超时；仍失败时可："
              echo "  1) Actions 手动 **Run workflow**，把 \`push_images\` 填 \`false\` 只构建验证（几分钟出结果）；"
              echo "  2) 在国内网络跑 \`deploy/build-push.sh\` 直接推 CCR；"
              echo "  3) 按 \`docs/DEPLOY_SPLIT.md\` 3.4 构建轻量浏览器镜像减小体积。"
              echo "- 本 job 已开 \`cancel-in-progress\`：再次 push 会自动取消卡住的旧 run。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          docker images | head -6 || true
