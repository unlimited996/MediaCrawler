name: build-and-push

# 触发条件：
#   * push 到 main（改代码/改 Dockerfile 都算）
#   * 手动触发（Actions 页面 Run workflow），可指定额外 tag
#   * 打 tag（v1.2.3）时额外打一个版本 tag
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".workbuddy/**"
  workflow_dispatch:
    inputs:
      extra_tag:
        description: "额外镜像 tag（留空则只用 latest + sha）"
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # 腾讯云容器镜像服务（个人版/企业版都适用）
  REGISTRY: ccr.ccs.tencentyun.com
  NAMESPACE: ${{ vars.TENCENT_NAMESPACE || 'media' }}
  # 没有配置密钥时只构建不推送，保证流水线本身可用来验证代码能不能打包
  FORCE_PUSH: ${{ vars.FORCE_PUSH_IMAGE || '0' }}

jobs:
  build:
    name: build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: crawler
            target: crawler
            port: 8001
          - service: data
            target: data
            port: 8081
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 计算镜像名与 tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          IMAGE="${REGISTRY}/${NAMESPACE}/mediacrawler-${{ matrix.service }}"
          TAGS="${IMAGE}:latest"
          TAGS="${TAGS},${IMAGE}:sha-${SHORT_SHA}"
          if [ -n "${GITHUB_REF_NAME}" ] && echo "${GITHUB_REF_NAME}" | grep -qE '^v[0-9]'; then
            TAGS="${TAGS},${IMAGE}:${GITHUB_REF_NAME}"
          fi
          if [ -n "${{ github.event.inputs.extra_tag }}" ]; then
            TAGS="${TAGS},${IMAGE}:${{ github.event.inputs.extra_tag }}"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}"    >> "$GITHUB_OUTPUT"
          echo "### ${{ matrix.service }} -> ${IMAGE}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${TAGS}\`"      >> "$GITHUB_STEP_SUMMARY"

      - name: 检查推送凭据
        id: creds
        env:
          USER: ${{ secrets.TENCENT_REGISTRY_USERNAME }}
          PASS: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}
        run: |
          if [ -n "$USER" ] && [ -n "$PASS" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
            echo "有推送凭据，构建后会推送到 ${REGISTRY}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ 未配置 TENCENT_REGISTRY_USERNAME / TENCENT_REGISTRY_PASSWORD，本次仅构建不推送" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 登录腾讯云镜像仓库
        if: steps.creds.outputs.has == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TENCENT_REGISTRY_USERNAME }}
          password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}

      - name: 构建并推送
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ steps.creds.outputs.has == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=mediacrawler-${{ matrix.service }}
          # GHA 缓存：python 依赖层 + npm/pip 缓存，二次构建显著更快
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            NPM_REGISTRY=https://registry.npmmirror.com

      - name: 记录结果
        run: |
          if [ "${{ steps.creds.outputs.has }}" = "true" ]; then
            echo "✅ 已推送：${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ℹ️ 镜像已构建但未推送（缺密钥）。到仓库 Settings → Secrets and variables → Actions 添加：" >> "$GITHUB_STEP_SUMMARY"
            echo "- \`TENCENT_REGISTRY_USERNAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- \`TENCENT_REGISTRY_PASSWORD\`" >> "$GITHUB_STEP_SUMMARY"
            echo "然后在 Actions 里 Re-run 本工作流即可推送。" >> "$GITHUB_STEP_SUMMARY"
          fi
          docker images | head -5 || true
