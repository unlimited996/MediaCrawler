# =============================================================================
# 数据库：192.168.10.38:4321 / im / **imdb**（不是默认的 postgres，
#         项目数据都在 imdb 库里；改库名后需 up -d 重建容器）
# 端口：宿主 18081 -> library 容器 8081（前端/网关，唯一入口）
#       宿主 18001 -> crawler 容器 8001（可选直连调试）
# 群晖 Container Manager 专用（只拉镜像、不构建；连接群晖本机已有的 PostgreSQL）
#
# 与 docker-compose.split.yml 的区别：
#   * 去掉 build: 段和 deploy/.env 依赖 —— 群晖不需要源码，导入即可运行
#   * 用 named volumes 而不是 ./xxx bind mount —— 群晖 DSM 的 Docker
#     **不会自动创建宿主目录**，bind mount 会报
#     Bind mount failed: ... does not exist（Linux Docker 上不会）
#   * 不挂载 ./database —— 那是**代码目录**（db_session.py/models_v2.py），
#     挂一个空目录进去会把代码覆盖掉，容器直接起不来（服务器部署踩过）
#   * 不挂载 ./deploy —— 配置全部写在 environment 里
#   * 不启动 PostgreSQL 容器 —— 直接用宿主机上已有的库（192.168.10.38:4321）
#   * 关掉 Nacos，用容器内网 DNS 静态互联（compose 内部 crawler:8001 可解析）
#
# ⚠️ 本文件会提交到公开仓库，所以**不含明文密码**。
#    上传前请在 Container Manager 项目的「环境变量」里加一条：
#        MC_DB_PASSWORD = 你的数据库密码
#    或者直接把下面 ${MC_DB_PASSWORD:?...} 整段替换成明文（别把改后的文件传 git）。
#
# 启动后**必须执行一次建表**（容器不会自动建表）：
#    docker exec mediacrawler-library python -m database.init_v2 postgres
#
# ⚠️ 宿主机 PostgreSQL 需要允许来自 Docker 网桥的连接：
#    listen_addresses 要包含 192.168.10.38（或 *）
#    pg_hba.conf 里放行容器网段（群晖通常是 172.16.0.0/12），例如：
#        host  all  im  172.16.0.0/12  scram-sha-256
#    群晖防火墙也要放行 4321。
# =============================================================================

services:
  crawler:
    image: ccr.ccs.tencentyun.com/unlimited996/mediacrawler-crawler:latest
    container_name: mediacrawler-crawler
    restart: unless-stopped
    environment:
      APP_ROLE: crawler
      SERVICE_NAME: mediacrawler-crawler
      SERVICE_PORT: "8001"
      PORT: "8001"
      WORKER_ENABLED: "1"
      # ---- 群晖本机已有的 PostgreSQL ----
      CONFIG_DB_TYPE: postgres
      POSTGRES_DB_HOST: 192.168.10.38
      POSTGRES_DB_PORT: "4321"
      POSTGRES_DB_USER: im
      POSTGRES_DB_PWD: ${MC_DB_PASSWORD:?请在群晖项目环境变量里设置 MC_DB_PASSWORD}
      POSTGRES_DB_NAME: imdb
      # ---- 服务互联：群晖没有 Nacos，必须关掉，否则每次发现都会先超时 ----
      NACOS_ENABLED: "0"
      # Nacos 就在本机内网；当前 NACOS_ENABLED=0 走静态互联、不产生连接，
      # 日后启用服务发现即用内网地址（别填 www.joyeuse.cn，DDNS 漂移会连不上）。
      # 注意 9000=OpenAPI，8085 只是控制台 Web 端口，填 8085 必然注册失败。
      NACOS_SERVER: "192.168.10.38:9000"
      # 与历史加密数据对齐：群晖 mc-data 是新卷，会自己生成另一把 Fernet key，
      # 导致库里 10-21 加密的 S3 Secret / 账号池 Cookie 解不开（Invalid signature）。
      # 固定成当初加密用的 key（本地 data/.cookie_key），一次性修好解密。
      COOKIE_ENC_KEY: ${COOKIE_ENC_KEY:-}
      CRAWLER_SERVICE_NAME: mediacrawler-crawler
      LIBRARY_SERVICE_NAME: mediacrawler-library
      CRAWLER_BASE_URL: http://crawler:8001
      LIBRARY_BASE_URL: http://library:8081
      GATEWAY_ENABLED: "0"
      # ---- 运行行为 ----
      SCHEDULER_ENABLED: "1"
      SCHEDULER_IN_API: "0"
      HEADLESS: "true"
      # 小红书默认走 CDP（连本机 Chrome:9222），那是本机开发模式；
      # 容器里没有本地浏览器，必须关掉，改用镜像自带的 headless chromium。
      XHS_ENABLE_CDP_MODE: "false"
      XHS_CDP_CONNECT_EXISTING: "false"
      # ---- 可选：改为连你电脑上开着的 Chrome（CDP，反检测更好）----
      # 把上面两项改成 "true"，再加一行 CDP_HOST: "<你电脑的局域网IP>"；
      # Chrome 启动参数、防火墙、风险见 docs/DEPLOY_SPLIT.md「容器连本地 Chrome」。
      # 注意：电脑关机/睡眠/Chrome 没开时，定时任务会直接失败。
      TZ: Asia/Shanghai
    volumes:
      - mc-logs:/app/logs
      - mc-data:/app/data
      - mc-browser-data:/app/browser_data
    ports:
      # 容器 8001 -> 宿主 18001（可选：直连调试 crawler 用）
      - "18001:8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/crawler/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  library:
    image: ccr.ccs.tencentyun.com/unlimited996/mediacrawler-library:latest
    container_name: mediacrawler-library
    restart: unless-stopped
    depends_on:
      - crawler
    environment:
      APP_ROLE: library
      SERVICE_NAME: mediacrawler-library
      SERVICE_PORT: "8081"
      PORT: "8081"
      WORKER_ENABLED: "0"
      # ---- 群晖本机已有的 PostgreSQL ----
      CONFIG_DB_TYPE: postgres
      POSTGRES_DB_HOST: 192.168.10.38
      POSTGRES_DB_PORT: "4321"
      POSTGRES_DB_USER: im
      POSTGRES_DB_PWD: ${MC_DB_PASSWORD:?请在群晖项目环境变量里设置 MC_DB_PASSWORD}
      POSTGRES_DB_NAME: imdb
      # ---- 服务互联 ----
      NACOS_ENABLED: "0"
      # Nacos 就在本机内网；当前 NACOS_ENABLED=0 走静态互联、不产生连接，
      # 日后启用服务发现即用内网地址（别填 www.joyeuse.cn，DDNS 漂移会连不上）。
      # 注意 9000=OpenAPI，8085 只是控制台 Web 端口，填 8085 必然注册失败。
      NACOS_SERVER: "192.168.10.38:9000"
      # 与历史加密数据对齐：群晖 mc-data 是新卷，会自己生成另一把 Fernet key，
      # 导致库里 10-21 加密的 S3 Secret / 账号池 Cookie 解不开（Invalid signature）。
      # 固定成当初加密用的 key（本地 data/.cookie_key），一次性修好解密。
      COOKIE_ENC_KEY: ${COOKIE_ENC_KEY:-}
      CRAWLER_SERVICE_NAME: mediacrawler-crawler
      LIBRARY_SERVICE_NAME: mediacrawler-library
      # 关键：网关把 /crawler/** 转发到这里，必须是容器服务名，不能是 127.0.0.1
      CRAWLER_BASE_URL: http://crawler:8001
      LIBRARY_BASE_URL: http://library:8081
      GATEWAY_ENABLED: "1"
      # ---- 运行行为 ----
      SCHEDULER_ENABLED: "1"
      SCHEDULER_IN_API: "0"
      HEADLESS: "true"
      TZ: Asia/Shanghai
    volumes:
      - mc-logs:/app/logs
      - mc-data:/app/data
      - mc-browser-data:/app/browser_data
    ports:
      # 容器 8081 -> 宿主 18081（前端 + 网关，对外唯一入口）
      - "18081:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/library/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

# Docker 自动创建并管理这三个卷；两个服务共用同一份（logs 是跨进程日志桥，
# browser_data 是登录态），不要给每个服务各建一个。
# 想在 File Station 里直接看文件，就改成 bind mount，但**必须先建目录**：
#   mkdir -p /volume1/docker/crawler/{logs,data,browser_data}
# 然后把上面的 mc-logs 换回 ./logs（另外两个同理）。
volumes:
  mc-logs:
  mc-data:
  mc-browser-data:
