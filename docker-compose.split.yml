# =============================================================================
# 拆分部署：crawler 服务 + library 内容库服务（library 同时是网关/唯一对外入口）
#
# 构建（本地，会先 npm build 前端再打进两个镜像；前端只编一次）：
#   docker compose -f docker-compose.split.yml build
# 启动（用本地刚构建的镜像）：
#   docker compose -f docker-compose.split.yml --env-file deploy/.env up -d
# 只拉远端镜像、不本地构建：
#   docker compose -f docker-compose.split.yml pull
#
# 对外端口：library 18081（唯一入口）/ crawler 18001（可选直连调试）
#   http://host:18081/                 前端
#   http://host:18081/library/api/**   内容库（帖子/评论/媒体/标签/菜谱/导出/S3）
#   http://host:18081/crawler/api/**   抓取（按服务名转发给 crawler 容器）
#
# 两个容器都从同一批镜像仓库拉取，日志与环境变量文件全部挂到宿主机：
#   ./logs/          应用日志（worker.out.log / *.console.log / scheduler_live.jsonl）
#   ./deploy/.env    启动环境变量（数据库、Nacos、时区等），改完 up -d 生效
#   ./browser_data/  浏览器登录态（必须持久化，否则每轮都要重新扫码）
#   ./data/          抓取产物
# =============================================================================

services:
  crawler:
    image: ${IMAGE_CRAWLER:-ccr.ccs.tencentyun.com/${TENCENT_NAMESPACE:-unlimited996}/mediacrawler-crawler:${IMAGE_TAG:-latest}}
    build:
      context: .
      target: crawler
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        SKIP_WEBUI_BUILD: ${SKIP_WEBUI_BUILD:-0}
        # 默认完整 chromium；跨境推送慢时可设 chromium-headless-shell 省约 600MB
        PLAYWRIGHT_BROWSER: ${PLAYWRIGHT_BROWSER:-chromium}
        # 国内构建换 apt / pip 源（CI 不经过 compose，仍用 Dockerfile 默认官方源）
        APT_MIRROR: ${APT_MIRROR:-mirrors.ustc.edu.cn}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        # 留空走官方 CDN；cdn 慢时可在 .env 设 https://npmmirror.com/mirrors/playwright/
        PLAYWRIGHT_DOWNLOAD_HOST: ${PLAYWRIGHT_DOWNLOAD_HOST:-}
    container_name: mediacrawler-crawler
    restart: unless-stopped
    env_file:
      # required:false -> 没建 deploy/.env 时 compose 仍可 config/build（只是变量为空）
      - path: ./deploy/.env
        required: false
    environment:
      APP_ROLE: crawler
      SERVICE_NAME: ${CRAWLER_SERVICE_NAME:-mediacrawler-crawler}
      SERVICE_PORT: "8001"
      PORT: "8001"
      WORKER_ENABLED: "1"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./browser_data:/app/browser_data
      - ./database:/app/database
      - ./deploy:/app/deploy:ro
    ports:
      # 直连调试用；正常访问走 library 的网关即可
      - "${CRAWLER_PORT:-18001}:8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/crawler/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  library:
    image: ${IMAGE_LIBRARY:-ccr.ccs.tencentyun.com/${TENCENT_NAMESPACE:-unlimited996}/mediacrawler-library:${IMAGE_TAG:-latest}}
    build:
      context: .
      target: library
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        SKIP_WEBUI_BUILD: ${SKIP_WEBUI_BUILD:-0}
        # library 只装 requirements-core.txt：不含 Playwright / opencv /
        # matplotlib / pandas / numpy，所以这里没有浏览器相关参数
        # （target=library 走不到 browser-runtime 那一层）。
        # 国内构建换 apt / pip 源（CI 不经过 compose，仍用 Dockerfile 默认官方源）
        APT_MIRROR: ${APT_MIRROR:-mirrors.ustc.edu.cn}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    container_name: mediacrawler-library
    restart: unless-stopped
    depends_on:
      crawler:
        condition: service_started
    env_file:
      # required:false -> 没建 deploy/.env 时 compose 仍可 config/build（只是变量为空）
      - path: ./deploy/.env
        required: false
    environment:
      APP_ROLE: library
      SERVICE_NAME: ${LIBRARY_SERVICE_NAME:-mediacrawler-library}
      SERVICE_PORT: "8081"
      PORT: "8081"
      GATEWAY_ENABLED: "1"
      # 容器内直连 crawler 服务的兜底地址（Nacos 正常时优先用 Nacos 发现）
      CRAWLER_BASE_URL: http://crawler:8001
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./browser_data:/app/browser_data
      - ./database:/app/database
      - ./deploy:/app/deploy:ro
    ports:
      - "${LIBRARY_PORT:-18081}:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/library/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
